name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force NuGet release even without Directory.Build.props change'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore FluxGuard.slnx

      - name: Build
        run: dotnet build FluxGuard.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FluxGuard.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --blame-hang --blame-hang-timeout 5m

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Compares the whole pushed range, not just the tip commit. With HEAD~1 a version bump
      # followed by any other commit in the same push was silently not released -- which is
      # exactly what happened to 0.12.0.
      - name: Check if Directory.Build.props changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event.inputs.force_release }}" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Force release triggered manually"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # No usable push range (manual dispatch, first push of a branch): fall back to the tip.
            if git diff --name-only HEAD~1 HEAD | grep -q "Directory.Build.props"; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -q "Directory.Build.props"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Extract version from Directory.Build.props
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      # Pack every packable project in the solution, not just the three named today. Naming individual
      # csproj files here is the same defect class that left FluxImprover.LMSupply and
      # FileFlux.Providers.LMSupply unpublished at every version until someone noticed (see
      # iyulab/FluxImprover@4f01b46, iyulab/FileFlux nuget-publish.yml) — a package that is never
      # produced cannot fail to push, so the gap stays invisible until someone looks for it on
      # NuGet.org. Packing the solution plus a verification step closes it for any future addition.
      - name: Pack
        if: steps.changed.outputs.changed == 'true'
        run: dotnet pack FluxGuard.slnx --configuration Release --output ./artifacts -p:TreatWarningsAsErrors=false

      - name: Verify all packable projects were produced
        if: steps.changed.outputs.changed == 'true'
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          missing=0
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' FluxGuard.slnx); do
            id=$(grep -oP '(?<=<PackageId>)[^<]+' "$csproj")
            if [ ! -f "./artifacts/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Push to NuGet
        if: steps.changed.outputs.changed == 'true'
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Summary
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "## Published to NuGet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Packages:**" >> $GITHUB_STEP_SUMMARY
          echo "- FluxGuard" >> $GITHUB_STEP_SUMMARY
          echo "- FluxGuard.Remote" >> $GITHUB_STEP_SUMMARY
          echo "- FluxGuard.SDK" >> $GITHUB_STEP_SUMMARY
